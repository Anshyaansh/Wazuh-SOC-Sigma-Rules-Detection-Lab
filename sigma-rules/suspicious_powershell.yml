title: Suspicious PowerShell Execution Flags
id: b5a1c2d3-0003-0003-0003-000000000003
status: stable
description: Detects PowerShell launched with flags commonly used by malware loaders and stagers
author: YourName
date: 2026/05/01
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_flags:
        CommandLine|contains:
            - '-nop'
            - '-noni'
            - '-enc'
            - '-EncodedCommand'
            - '-w hidden'
            - '-WindowStyle Hidden'
    condition: selection_img and selection_flags
falsepositives:
    - Legitimate admin scripts using encoded commands
    - Deployment tools like SCCM or Ansible
level: high