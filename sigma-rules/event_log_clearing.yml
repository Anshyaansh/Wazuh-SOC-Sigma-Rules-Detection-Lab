title: Event Log Clearing via wevtutil
id: b5a1c2d3-0006-0006-0006-000000000006
status: stable
description: Detects attackers clearing Windows event logs to cover tracks
author: Priya
date: 2026/05/01
tags: 
    - attack.defense_evasion
    - attack.t1070.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
	CommandLine|contains:
	    - 'wevtutil cl'
	    - 'wevtutil clear-log'
	    - 'Clear-EventLog'
    condition: selection
falsepositives:
    - Legitimate IT admins clearing logs during maintenance
level: high