title: Post-Compromise System Discovery Commands
id: b5a1c2d3-0010-0010-0010-000000000010
status: stable
description: Detects common recon commands run after initial compromise to profile the system
author: YourName
date: 2026/05/01
tags:
    - attack.discovery
    - attack.t1033
    - attack.t1082
    - attack.t1016
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\whoami.exe'
            - '\systeminfo.exe'
            - '\ipconfig.exe'
            - '\net.exe'
        CommandLine|contains:
            - 'whoami'
            - 'systeminfo'
            - 'ipconfig /all'
            - 'net localgroup'
    condition: selection
falsepositives:
    - System administrators running diagnostics
    - Monitoring scripts
level: medium